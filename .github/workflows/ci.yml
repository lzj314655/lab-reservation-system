name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: lzjai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -ptest123456 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    env:
      # 测试只需 DB 连接；JWT/LLM 配置在导入期不做网络调用
      TEST_DB_URL: mysql+pymysql://root:test123456@127.0.0.1:3306/lzjai_test
      DATABASE_URL: mysql+pymysql://root:test123456@127.0.0.1:3306/lzjai_test
      JWT_SECRET_KEY: ci-test-secret
      JWT_EXPIRE_HOURS: 1
      LLM_API_KEY: sk-ci-placeholder
      LLM_MODEL: ci-model
      LLM_BASE_URL: http://localhost:9/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests scripts

      - name: Test (pytest + coverage)
        working-directory: backend
        # HF_HUB_OFFLINE: CI 无缓存也不联网 —— conftest 不触发 embedding 加载，
        # kb_service 仅在导入期设 env，不加载模型
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/ -v --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t lab-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t lab-frontend:ci ./frontend
