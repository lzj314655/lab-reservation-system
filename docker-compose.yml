name: lab-reservation

services:
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lzjai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"   # 宿主机 3307，避免与本地 MySQL 冲突
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 可选：当前后端未使用 Redis（通知轮询/限流均为 DB 实现），
  # 默认不启动；需要时 `docker compose --profile redis up -d`
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: lab-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@mysql:3306/${MYSQL_DATABASE:-lzjai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_API_KEY: ${LLM_API_KEY:-sk-xxx}
      LLM_MODEL: ${LLM_MODEL:-agnes-3.0-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.agnes-ai.cn/v1}
    volumes:
      - chroma-data:/app/data/chroma     # 向量库持久化（首次启动自动向量化语料）
      - uploads:/app/uploads             # 上传文件持久化
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: lab-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql-data:
  chroma-data:
  uploads:
